<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Apply — Senior Fullstack Engineer (MOCK ATS)</title>
    <style>
      body { font-family: -apple-system, system-ui, sans-serif; max-width: 720px; margin: 40px auto; color: #0f172a; }
      label { display: block; margin: 14px 0 4px; font-weight: 600; font-size: 14px; }
      input, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
      button { margin-top: 22px; padding: 12px 20px; border: 0; border-radius: 999px; background: #0f172a; color: #fff; font-weight: 600; cursor: pointer; }
      .note { color: #64748b; font-size: 13px; }
      .submitted { margin-top: 20px; padding: 14px; background: #ecfdf5; border: 1px solid #6ee7b7; border-radius: 10px; display: none; }
      #submitted:target .submitted { display: block; }
    </style>
  </head>
  <body>
    <h1>Apply: Senior Fullstack Engineer</h1>
    <p class="note">MOCK ATS — halaman ini hanya untuk menguji autofill. Tidak ada data yang dikirim ke mana pun.</p>
    <form id="app" action="#submitted" method="get">
      <label for="first_name">First Name *</label>
      <input id="first_name" name="first_name" required />

      <label for="last_name">Last Name *</label>
      <input id="last_name" name="last_name" required />

      <label for="email">Email *</label>
      <input id="email" name="email" type="email" required />

      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" />

      <label for="location">Current location</label>
      <input id="location" name="location" />

      <label for="linkedin">LinkedIn profile</label>
      <input id="linkedin" name="linkedin" />

      <label for="github">GitHub / portfolio</label>
      <input id="github" name="github" />

      <label for="salary">Salary expectation</label>
      <input id="salary" name="salary" />

      <label for="resume">Resume *</label>
      <input id="resume" name="resume" type="file" required />

      <label for="cover">Cover letter</label>
      <textarea id="cover" name="cover" rows="8"></textarea>

      <button type="submit" id="submit_app">Submit application</button>
    </form>
    <div class="submitted" id="submitted">Application submitted (mock).</div>
  </body>
</html>
